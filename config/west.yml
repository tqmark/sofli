manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # Bumped from 4ec69cb for layer locking (ZMK 5138c6f, 2025-11-14): &tog
      # now marks a layer locked, so &mo/&lt release no longer tears it back
      # down. That is what makes "hold X, tap Z" lock Lower.
      #
      # Deliberately NOT main. abb64ba is the last commit before ZMK moved to
      # Zephyr 4.1 and Hardware Model V2 (c06fa48, 2025-12-10), which renames
      # the board from nice_nano_v2 to nice_nano//zmk and drags in eleven
      # months of unrelated change. This pin is the smallest step that gets
      # locking: still Zephyr 3.5, still the same board and shield.
      revision: abb64ba316c29caddc49727ca2cac2f0ed5970c7
      import: app/west.yml
  self:
    path: config
