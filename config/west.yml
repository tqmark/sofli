manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # Bumped from 4ec69cb (2025-09-30) for layer locking: &tog now marks a
      # layer locked, so &mo/&lt release no longer tears it back down. That is
      # what makes "hold X, tap Z" lock Lower.
      revision: 641514a97db345f499dd50b0360e594270f008fe
      import: app/west.yml
  self:
    path: config
